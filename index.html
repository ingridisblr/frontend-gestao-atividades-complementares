<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./assets/imagens/k-logo1.png">
    <title>KORE - Sistema de Gestão</title>
    <style>
        
        body {
            margin: 0px;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        
        .login-container {
            background-color: #ffffff;
            width: 100%;
            max-width: 420px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

    
        .logo-box {
            margin-bottom: 20px;
        }

        .logo-box img {
            width: 200px; 
            height: auto;
        }

        .subtitle {
            color: #64748b;
            font-size: 15px;
            margin-bottom: 30px;
            font-weight: 400;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #334155;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #00B7B8; 
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background-color: #00B7B8; 
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
            margin-top: 10px;
        }

        .btn-login:hover {
            background-color: #00999a; 
        }

        .btn-login:active {
            transform: scale(0.98);
        }

        .footer {
            background: #0f1923;
            color: #fff;
            text-align: center;
            padding: 15px;
            font-size: 12px;
            position: fixed;
            bottom: 0;
            width: 100%;
            }

        .footer p {
            margin: 5px 0;
            }

        .footer a {
            color: #ccc;
            text-decoration: underline;
            }

        .footer a:hover {
            color: #fff;
            }

    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo-box">
            <img src="./assets/imagens/logo.png" alt="KORE Logo">
            <div class="subtitle">Sistema de Gestão de Atividades Complementares</div>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="seu@email.com" required>
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-login">Entrar</button>
        </form>
      </div>  

      <footer class="footer">
  <p>
    © 2026 KORE Sistema de Gestão - Todos os direitos reservados.<br>
  </p>
</footer>

    <script src="login.js"></script>
    
</body>
</html>
