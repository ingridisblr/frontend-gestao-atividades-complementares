<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KORE - Alunos</title>
    <link rel="icon" href="../../../assets/imagens/k-logo1.png">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../../shared/css/global.css">
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-logo">
            <img src="../../../assets/imagens/k-logo1.png" alt="KORE" class="sidebar-k-logo">
            <div>
                <div class="brand-name">KORE</div>
                <div class="brand-sub">Coordenação</div>
            </div>
        </div>

        <nav class="sidebar-nav">
            <a class="nav-item" href="dashboard.html">
                <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                    <rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/>
                    <rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
                </svg>
                Dashboard
            </a>
            <a class="nav-item active" href="alunos.html">
                <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                    <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/>
                    <path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/>
                </svg>
                Alunos
            </a>
            <a class="nav-item" href="atividades.html">
                <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                    <path d="M9 12h6M9 16h6M7 4H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2V6a2 2 0 00-2-2h-2"/>
                    <path d="M9 4h6v4H9V4z"/>
                </svg>
                Atividades
            </a>
            <a class="nav-item" href="relatorio.html">
                <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                    <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
                    <path d="M14 2v6h6M8 13h8M8 17h5"/>
                </svg>
                Relatórios
            </a>
        </nav>

        <div class="sidebar-footer">
            <div class="nav-item" onclick="logout()" style="color:#ef4444">
                <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                    <path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h6a2 2 0 012 2v1"/>
                </svg>
                Sair
            </div>
        </div>
    </aside>

    <div class="main">
        <header class="topbar">
            <div class="topbar-user">
                <span class="user-name" id="userName">Carregando...</span>
                <span class="user-email" id="userEmail"></span>
            </div>
        </header>

        <main class="content">
            <div class="page-header">
                <div>
                    <h1 class="page-title">Alunos</h1>
                    <p class="page-subtitle">Cadastre e acompanhe alunos do curso selecionado no dashboard</p>
                </div>
                <button class="btn-salvar" onclick="abrirModalAluno()">+ Novo Aluno</button>
            </div>

            <div class="card busca-card">
                <div class="busca-wrapper">
                    <input type="text" id="campoBuscaAluno" class="busca-input" placeholder="Buscar por nome, matrícula ou email">
                </div>
            </div>

            <div class="card">
                <div style="overflow-x: auto;">
                    <table class="tabela">
                        <thead>
                            <tr>
                                <th>Nome</th>
                                <th>Matrícula</th>
                                <th>Curso</th>
                                <th>Email</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaAlunosBody">
                            <tr>
                                <td colspan="5" class="loading-cell">Carregando alunos...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="modalAlunoOverlay" onclick="fecharModalAluno()"></div>
    <div class="modal" id="modalAluno">
        <div class="modal-header">
            <h3 id="modalAlunoTitulo">Novo Aluno</h3>
            <button class="modal-close" onclick="fecharModalAluno()">×</button>
        </div>

        <div class="modal-body">
            <div class="form-group">
                <label class="form-label">Nome completo</label>
                <input type="text" id="inputAlunoNome" class="form-input">
            </div>

            <div class="form-group">
                <label class="form-label">Matrícula</label>
                <input type="text" id="inputAlunoMatricula" class="form-input">
            </div>

            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" id="inputAlunoEmail" class="form-input">
            </div>

            <div class="form-group">
                <label class="form-label">Data prevista de colação</label>
                <input type="date" id="inputAlunoDataColacao" class="form-input">
            </div>

            <div class="form-group">
                <label class="form-label">Curso</label>
                <select id="inputAlunoCurso" class="form-input">
                    <option value="">Selecione um curso</option>
                </select>
            </div>
        </div>

        <div class="modal-footer">
            <button class="btn-cancelar" onclick="fecharModalAluno()">Cancelar</button>
            <button class="btn-salvar" id="btnSalvarAluno" onclick="salvarAlunoCoord()">Salvar</button>
        </div>
    </div>

    <script src="../../../shared/js/api.js"></script>
    <script src="../../../shared/js/auth.js"></script>
    <script src="../../../shared/js/components.js"></script>
    <script src="../js/curso-contexto.js"></script>
    <script src="../js/alunos.js"></script>
</body>
</html>
