<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KORE - Atividades</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/atividades.css">
</head>
<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            <img src="../../../assets/imagens/k-logo.png" alt="KORE" class="sidebar-k-logo">
            <div>
                <div class="brand-name">KORE</div>
                <div class="brand-sub">Coordenação</div>
            </div>
        </div>

        <nav class="sidebar-nav">
            <a class="nav-item" href="dashboard.html">
                <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                    <rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/>
                    <rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
                </svg>
                Dashboard
            </a>
            <a class="nav-item active" href="atividades.html">
                <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                    <path d="M9 12h6M9 16h6M7 4H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2V6a2 2 0 00-2-2h-2"/>
                    <path d="M9 4h6v4H9V4z"/>
                </svg>
                Atividades
            </a>
            <a class="nav-item" href="historico.html">
                <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>
                </svg>
                Histórico
            </a>
        </nav>

        <div class="sidebar-footer">
            <div class="nav-item" onclick="logout()" style="color:#ef4444">
                <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                    <path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h6a2 2 0 012 2v1"/>
                </svg>
                Sair
            </div>
        </div>
    </aside>

    <!-- MAIN -->
    <div class="main">

        <!-- TOPBAR -->
        <header class="topbar">
            <div class="topbar-user">
                <span class="user-name" id="userName">Carregando...</span>
                <span class="user-email" id="userEmail"></span>
            </div>
            <button class="btn-logout" onclick="logout()">
                <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                    <path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h6a2 2 0 012 2v1"/>
                </svg>
                Sair
            </button>
        </header>

        <!-- CONTENT -->
        <main class="content">
            <h1 class="page-title">Atividades</h1>
            <p class="page-subtitle">Gerencie e valide as atividades complementares</p>

            <!-- FILTROS -->
            <div class="card filtros-card">
                <div class="filtros-grid">
                    <div class="filtro-group">
                        <label class="filtro-label">Status</label>
                        <select id="filtroStatus" class="filtro-select" onchange="filtrar()">
                            <option value="">Todos</option>
                            <option value="pendente">Pendente</option>
                            <option value="aprovada">Aprovada</option>
                            <option value="reprovada">Reprovada</option>
                        </select>
                    </div>
                    <div class="filtro-group">
                        <label class="filtro-label">Curso</label>
                        <select id="filtroCurso" class="filtro-select" onchange="filtrar()">
                            <option value="">Todos</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- TABELA -->
            <div class="card">
                <table class="tabela">
                    <thead>
                        <tr>
                            <th>Aluno</th>
                            <th>Curso</th>
                            <th>Categoria</th>
                            <th>Carga Horária</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaBody">
                        <tr>
                            <td colspan="6" class="loading-cell">
                                <div class="skeleton skeleton-text" style="width:40%;margin:0 auto"></div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Scripts: ordem importa! -->
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/atividades.js"></script>

</body>
</html>
