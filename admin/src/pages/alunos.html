    <div class="main">

        <!-- TOPBAR -->
        <header class="topbar">
            <div class="topbar-user">
                <span class="user-name" id="userName">Carregando...</span>
                <span class="user-email" id="userEmail"></span>
            </div>
        </header>

      
        <main class="content">
            <div class="page-header">
                <div>
                    <h1 class="page-title">Alunos</h1>
                    <p class="page-subtitle">Gerencie os alunos cadastrados</p>
                </div>
                <button class="btn-novo" onclick="abrirModal()">
                    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="16" height="16">
                        <path d="M12 5v14M5 12h14"/>
                    </svg>
                     Novo Aluno
                </button>
            </div>

         
            <div class="card busca-card">
                <div class="busca-wrapper">
                    <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" class="busca-icon">
                        <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
                    </svg>
                    <input type="text" id="campoBusca" class="busca-input" placeholder="Buscar por nome, matrícula ou email..." oninput="buscar()">
                </div>
            </div>

           
            <div class="card">
                <table class="tabela">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Matrícula</th>
                            <th>Curso</th>
                            <th>Email</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaBody">
                        <tr>
                            <td colspan="5" class="loading-cell">
                                <div class="skeleton skeleton-text" style="width:40%;margin:0 auto"></div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- MODAL NOVO/EDITAR ALUNO -->
    <div class="modal-overlay" id="modalOverlay" onclick="fecharModal()"></div>
    <div class="modal" id="modal">
        <div class="modal-header">
            <h3 id="modalTitulo">Novo Aluno</h3>
            <button class="modal-close" onclick="fecharModal()">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="18" height="18">
                    <path d="M18 6L6 18M6 6l12 12"/>
                </svg>
            </button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label class="form-label">Nome completo</label>
                <input type="text" id="inputNome" class="form-input" placeholder="Ex: Ana Costa">
            </div>
            <div class="form-group">
                <label class="form-label">Matrícula</label>
                <input type="text" id="inputMatricula" class="form-input" placeholder="Ex: 2021001">
            </div>
            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" id="inputEmail" class="form-input" placeholder="Ex: ana@email.com">
            </div>

            <div class="form-group">
                <label class="form-label">Data prevista de colação</label>
                <input type="date" class="form-input" id="inputDataColacao">
            </div>
           
            <div class="form-group">
                <label class="form-label">Curso</label>
                <select class="form-input" id="inputCurso">
                    <option value="">Selecione um curso</option>
                </select>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
            <button class="btn-salvar" id="btnSalvar" onclick="salvarAluno()">Salvar</button>
        </div>
    </div>

    <!-- TOAST -->
    <div class="toast" id="toast">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="16" height="16">
            <path d="M20 6L9 17l-5-5"/>
        </svg>
        <span id="toastMsg">Atualizando...</span>
    </div>

    <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker
                .register('/sw.js')
                .then(reg => console.log('[PWA] SW registrado:', reg.scope))
                .catch(err => console.warn('[PWA] Falha:', err));
        });
    }
</script>

    <script src="../../../shared/js/api.js"></script>

    <script src="../../../shared/js/components.js"></script>
    <script src="../js/alunos.js"></script>

</body>
</html>
