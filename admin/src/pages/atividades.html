<!-- mantém seu HTML atual e altere só a parte da CONTENT/TABELA -->

<main class="content">
    <h1 class="page-title">Atividades (Visão Global)</h1>
    <p class="page-subtitle">Visualize, analise e valide os certificados enviados pelos alunos</p>

    <div class="card filtro-card">
        <div class="filtro-group">
            <label class="filtro-label">Filtrar por Status</label>
            <select id="filtroStatus" class="filtro-select" onchange="filtrar()">
                <option value="">Todos</option>
                <option value="enviada">Enviada</option>
                <option value="em análise">Em análise</option>
                <option value="aprovada">Aprovada</option>
                <option value="reprovada">Reprovada</option>
            </select>
        </div>
    </div>

    <div class="card">
        <table class="tabela">
            <thead>
                <tr>
                    <th>Aluno</th>
                    <th>Curso</th>
                    <th>Categoria</th>
                    <th>Horas</th>
                    <th>Status</th>
                    <th>Data</th>
                    <th>Ação</th>
                </tr>
            </thead>
            <tbody id="tabelaBody">
                <tr>
                    <td colspan="7" class="loading-cell">
                        <div class="skeleton skeleton-text" style="width:40%;margin:0 auto"></div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</main>

<!-- MODAL DE ANÁLISE -->
<div id="modalAtividade" class="modal-overlay" style="display:none;">
    <div class="modal-content" style="max-width:900px;">
        <div class="modal-header">
            <h2>Análise da Atividade</h2>
            <button class="modal-close" onclick="fecharModal()">×</button>
        </div>

        <div class="modal-body">
            <input type="hidden" id="atividadeId">

            <div class="detalhes-grid">
                <div>
                    <label>Aluno</label>
                    <p id="detalheAluno">–</p>
                </div>

                <div>
                    <label>Curso</label>
                    <p id="detalheCurso">–</p>
                </div>

                <div>
                    <label>Categoria</label>
                    <p id="detalheCategoria">–</p>
                </div>

                <div>
                    <label>Carga horária informada</label>
                    <p id="detalheHoras">–</p>
                </div>

                <div>
                    <label>Status atual</label>
                    <p id="detalheStatus">–</p>
                </div>

                <div>
                    <label>Data de envio</label>
                    <p id="detalheData">–</p>
                </div>
            </div>

            <div class="form-group">
                <label>Título da atividade</label>
                <p id="detalheTitulo">–</p>
            </div>

            <div class="form-group">
                <label>Descrição</label>
                <p id="detalheDescricao">–</p>
            </div>

            <div class="form-group">
                <label>Certificado / Comprovante</label>
                <div id="previewArquivo" class="arquivo-preview">
                    Nenhum arquivo encontrado.
                </div>
            </div>

            <div class="form-group">
                <label for="cargaHorariaValidada">Carga horária validada</label>
                <input 
                    type="number" 
                    id="cargaHorariaValidada" 
                    class="form-input" 
                    min="0"
                    placeholder="Ex.: 20"
                >
            </div>

            <div class="form-group">
                <label for="observacaoCoordenador">Minha análise</label>
                <textarea 
                    id="observacaoCoordenador" 
                    class="form-input" 
                    rows="4"
                    placeholder="Escreva sua análise sobre o certificado enviado..."
                ></textarea>
            </div>

            <div class="form-group">
                <label for="justificativaReprovacao">Justificativa em caso de reprovação</label>
                <textarea 
                    id="justificativaReprovacao" 
                    class="form-input" 
                    rows="3"
                    placeholder="Obrigatório apenas se a atividade for reprovada..."
                ></textarea>
            </div>
        </div>

        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="fecharModal()">Cancelar</button>
            <button class="btn btn-danger" onclick="atualizarStatus('Reprovada')">Reprovar</button>
            <button class="btn btn-primary" onclick="atualizarStatus('Aprovada')">Aprovar</button>
        </div>
    </div>
</div>
