<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../../../assets/imagens/k-logo1.png">
    <title>KORE - Categorias</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../../shared/css/global.css">
    <link rel="stylesheet" href="../css/categorias.css">
</head>
<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            <img src="../../../assets/imagens/k-logo1.png" alt="KORE" class="sidebar-k-logo">
            <div>
                <div class="brand-name">KORE</div>
                <div class="brand-sub">Administração</div>
            </div>
        </div>

        <nav class="sidebar-nav">
            <a class="nav-item" href="dashboard.html">
                <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                    <rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/>
                    <rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
                </svg>
                Dashboard Geral
            </a>
            <a class="nav-item" href="cursos.html">
                <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                    <path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/>
                </svg>
                Cursos
            </a>
            <a class="nav-item active" href="categorias.html">
                <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                    <path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/>
                </svg>
                Categorias
            </a>
            <a class="nav-item" href="regras.html">
                <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 010 14.14M4.93 4.93a10 10 0 000 14.14"/>
                </svg>
                Regras de CH
            </a>
            <a class="nav-item" href="alunos.html">
                <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                    <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/>
                </svg>
                Alunos
            </a>
            <a class="nav-item" href="atividades.html">
                <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                    <path d="M9 12h6M9 16h6M7 4H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2V6a2 2 0 00-2-2h-2"/>
                    <path d="M9 4h6v4H9V4z"/>
                </svg>
                Atividades
            </a>
            <a class="nav-item" href="auditoria.html">
                <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>
                </svg>
                Auditoria
            </a>
        </nav>

        <div class="sidebar-footer">
            <div class="nav-item" onclick="logout()" style="color:#ef4444">
                <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                    <path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h6a2 2 0 012 2v1"/>
                </svg>
                Sair
            </div>
        </div>
    </aside>

    <div class="main">

        <header class="topbar">
            <div class="topbar-user">
                <span class="user-name" id="userName">Carregando...</span>
                <span class="user-email" id="userEmail"></span>
            </div>
            <button class="btn-logout" onclick="logout()">
                <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                    <path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h6a2 2 0 012 2v1"/>
                </svg>
                Sair
            </button>
        </header>

        <main class="content">
            <div class="header-section">
                <h1 class="page-title">Categorias</h1>
                <p class="page-subtitle">Gerencie as categorias de atividades complementares</p>
                <button class="btn-primary" onclick="abrirModal()">
                    <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                        <path d="M12 5v14M5 12h14"/>
                    </svg>
                    Nova Categoria
                </button>
            </div>

            <div class="card filtros-card">
                <div class="filtros-grid">
                    <div class="filtro-group">
                        <label class="filtro-label">Buscar</label>
                        <input type="text" id="filtroBusca" class="filtro-input" placeholder="Nome da categoria..." oninput="filtrar()">
                    </div>
                    <div class="filtro-group">
                        <label class="filtro-label">Status</label>
                        <select id="filtroStatus" class="filtro-select" onchange="filtrar()">
                            <option value="">Todos</option>
                            <option value="ativo">Ativo</option>
                            <option value="inativo">Inativo</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="card">
                <table class="tabela">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Descrição</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaBody">
                        <!-- Dados serão inseridos aqui -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- MODAL -->
    <div id="modal" class="modal-overlay" style="display:none">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Nova Categoria</h3>
                <button class="modal-close" onclick="fecharModal()">
                    <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                        <path d="M18 6L6 18M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            <form id="formCategoria" onsubmit="salvarCategoria(event)">
                <div class="form-group">
                    <label class="form-label">Nome da Categoria *</label>
                    <input type="text" id="inputNome" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Descrição</label>
                    <textarea id="inputDescricao" class="form-textarea" rows="3" placeholder="Descrição opcional da categoria..."></textarea>
                </div>
                <div class="form-group">
                    <label class="form-switch">
                        <input type="checkbox" id="inputAtivo" checked>
                        <span class="switch-slider"></span>
                        Categoria ativa
                    </label>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-secondary" onclick="fecharModal()">Cancelar</button>
                    <button type="submit" class="btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../../../shared/js/api.js"></script>
    <script src="../../../shared/js/auth.js"></script>
    <script src="../../../shared/js/components.js"></script>
    <script src="../js/categorias.js"></script>
</body>
</html>
